<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover permite usar toda la pantalla en iPhone (zonas seguras) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF6F0" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <title>Magdalena</title>
    <script>
      // Aplica el tema y el tamaño de letra guardados ANTES de pintar la página,
      // para evitar un parpadeo de color claro al abrir en modo oscuro.
      // Debe coincidir con la lógica de src/lib/ajustes.ts
      ;(function () {
        try {
          var a = JSON.parse(localStorage.getItem('magdalena:ajustes') || '{}')
          var tema = a.tema || 'sistema'
          var oscuro =
            tema === 'oscuro' ||
            (tema === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (oscuro) document.documentElement.classList.add('dark')
          var escalas = [87.5, 100, 112.5, 125, 137.5]
          var i = typeof a.tamanoLetra === 'number' ? a.tamanoLetra : 1
          document.documentElement.style.fontSize = (escalas[i] || 100) + '%'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
